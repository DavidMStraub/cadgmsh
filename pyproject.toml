[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadgmsh"
version = "0.3.0"
description = "Mesh CadQuery/build123d geometry with gmsh"
authors = [{name = "David Straub", email = "straub@protonmail.com"}]
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.15"
dependencies = [
    "gmsh",
    "meshio",
    "numpy",
    # NOTE: OCP is deliberately *not* declared here. It ships as two rival
    # distributions -- cadquery-ocp and cadquery-ocp-novtk -- that both install
    # into the same `OCP/` package, so pinning either one can silently mix
    # halves of two OCCT versions with whatever build123d/cadquery pulled in.
    # The CAD library the caller already needs brings its own; _occ.py adapts
    # to OCCT 7 or 8 at import time.
]

[project.urls]
Repository = "https://github.com/DavidMStraub/cadgmsh"

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "build123d", "cadquery"]
dev  = ["cadgmsh[test]", "pyright", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]   # allow assert False in tests
