name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools_scm derives the version from tags
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: pyright src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools_scm derives the version from tags

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install system libs
        run: sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev

      - name: Install package + test deps
        run: pip install -e ".[test]"

      - name: Test
        run: pytest --tb=short

  # build123d/cadquery still pin cadquery-ocp<8, so the job above always
  # resolves to OCCT 7.x. This one installs OCCT 8 *instead of* them -- they
  # cannot coexist, since cadquery-ocp and cadquery-ocp-novtk share the `OCP/`
  # package -- and runs the OCP-only tests, which keeps the shim honest.
  test-occt8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools_scm derives the version from tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install system libs
        run: sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev

      # cadgmsh declares no OCP dependency (see pyproject.toml), so this job
      # names the OCCT 8 build explicitly.
      - name: Install package with OCCT 8
        run: pip install -e . pytest "cadquery-ocp>=8,<9"

      - name: Test
        run: pytest --tb=short tests/test_raw_occ.py tests/test_extract.py
